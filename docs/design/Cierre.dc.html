<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cierre de sesión — Recetario</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C8F031;text-decoration:none}a:hover{color:#E1FF6B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background-color: #0B0E14; background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 14px); font-family: 'Space Grotesk', system-ui, sans-serif; color: #E9ECF2; display: flex; flex-direction: column">
  <header style="padding: 26px 20px 10px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-family: 'Chakra Petch', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #C8F031">RECETARIO · 1 H 12 MIN</span>
      <h1 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-size: 28px; font-weight: 700; line-height: 1; text-transform: uppercase">Resultado</h1>
    </div>
    <span style="font-family: 'Chakra Petch', sans-serif; font-size: 15px; font-weight: 700; color: #0B0E14; background: #C8F031; padding: 6px 10px; clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%)">+1 · 3/4</span>
  </header>

  <form style="flex-grow: 1; padding: 6px 16px 24px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="qued" style="display: flex; justify-content: space-between; font-family: 'Chakra Petch', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #8B93A5">QUÉ QUEDÓ FUNCIONANDO <span style="color: #C8F031">BORRADOR CLAUDE CODE</span></label>
      <textarea id="qued" rows="4" style="box-sizing: border-box; width: 100%; border: 1px solid #3A4560; padding: 12px; font-family: inherit; font-size: 14px; line-height: 1.45; color: #E9ECF2; background: #141925; resize: none">Variables de entorno cargadas en el hosting. El deploy de staging levanta y responde en /health.</textarea>
    </div>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px">
      <legend style="font-family: 'Chakra Petch', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #8B93A5; padding: 0 0 6px">OBJETIVOS CUMPLIDOS HOY</legend>
      <label style="display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 12px; background: #161D0C; border: 1px solid #44561A; font-size: 14px">
        <input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #C8F031; margin: 0">
        Variables de entorno configuradas
      </label>
      <label style="display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 12px; background: #141925; border: 1px solid #263046; font-size: 14px">
        <input type="checkbox" style="width: 20px; height: 20px; accent-color: #C8F031; margin: 0">
        Login y creación de receta en staging
      </label>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="bloq" style="font-family: 'Chakra Petch', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #8B93A5">QUÉ BLOQUEA (OPCIONAL)</label>
      <input id="bloq" type="text" placeholder="Nada por ahora" style="box-sizing: border-box; width: 100%; min-height: 46px; border: 1px solid #3A4560; padding: 0 12px; font-family: inherit; font-size: 14px; background: #141925; color: #E9ECF2">
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="sig" style="font-family: 'Chakra Petch', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #8B93A5">SIGUIENTE MOVIMIENTO</label>
      <input id="sig" type="text" value="Probar login en staging con usuario real" style="box-sizing: border-box; width: 100%; min-height: 46px; border: 1px solid #3A4560; padding: 0 12px; font-family: inherit; font-size: 14px; background: #141925; color: #E9ECF2">
    </div>

    <div style="flex-grow: 1"></div>

    <a href="Main.dc.html" style="display: flex; justify-content: center; align-items: center; min-height: 56px; background: #C8F031; color: #0B0E14; font-family: 'Chakra Petch', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px)">Guardar resultado</a>
  </form>
</div>
</x-dc>

</body>
</html>
